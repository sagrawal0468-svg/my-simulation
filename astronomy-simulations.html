<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seeing the Invisible — Interactive Simulations</title>
<style>
:root{color-scheme:dark;--bg:#02050b;--panel:#09111dcc;--line:#6ee7ff;--gold:#ffc96b;--muted:#93a6bb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#fff}
canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none}.title{position:absolute;left:4vw;top:4vh;font-size:clamp(24px,3vw,52px);font-weight:620;letter-spacing:-.035em}.sub{display:block;margin-top:.45rem;color:var(--muted);font-size:.38em;font-weight:500;letter-spacing:.05em;text-transform:uppercase}.controls{pointer-events:auto;position:absolute;left:50%;bottom:3.5vh;transform:translateX(-50%);display:flex;align-items:center;gap:18px;min-width:min(900px,92vw);padding:13px 18px;border:1px solid #ffffff16;border-radius:16px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 20px 70px #0008}.group{display:grid;gap:4px;min-width:145px;flex:1}.label{display:flex;justify-content:space-between;font-size:11px;color:#b9c8d6;text-transform:uppercase;letter-spacing:.08em}.value{color:#fff}.range{accent-color:#75ddff;width:100%}.btn{border:1px solid #ffffff22;background:#ffffff0b;color:white;border-radius:10px;padding:9px 12px;cursor:pointer}.btn:hover{background:#ffffff17}.badge{position:absolute;right:4vw;top:5vh;color:#9fb3c6;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}.big{font-size:clamp(36px,6.8vw,108px);font-weight:650;letter-spacing:-.05em}.small{margin-top:14px;color:#b6c5d4;font-size:clamp(14px,1.6vw,24px)}.hidden{display:none!important}.hint{position:absolute;right:4vw;bottom:3.5vh;color:#8fa2b4;font-size:12px}.readout{position:absolute;left:4vw;bottom:15vh;font-size:clamp(18px,2.3vw,38px);font-weight:560}.readout span{color:var(--gold)}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="hud"><div class="title" id="title"></div><div class="badge" id="badge">Seeing the Invisible</div><div class="readout" id="readout"></div><div class="center hidden" id="center"></div><div class="controls" id="controls"></div><div class="hint">Space pause · R reset · H hide controls</div></div>
<script>
const C=document.querySelector('#c'),ctx=C.getContext('2d'),title=document.querySelector('#title'),controls=document.querySelector('#controls'),readout=document.querySelector('#readout'),center=document.querySelector('#center');
let W,H,dpr=Math.min(devicePixelRatio||1,2),paused=false,t0=performance.now(),last=t0,state={};
function resize(){W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
function starfield(n=260){ctx.fillStyle='#02050b';ctx.fillRect(0,0,W,H);for(let i=0;i<n;i++){let x=(i*197.3%997)/997*W,y=(i*431.7%991)/991*H,a=.16+.55*((i*67)%100)/100;ctx.fillStyle=`rgba(190,220,255,${a})`;ctx.fillRect(x,y,i%17?1:1.8,i%17?1:1.8)}}
function group(label,min,max,step,value,id,fmt=x=>x){return `<label class="group"><span class="label">${label}<b class="value" id="${id}v">${fmt(value)}</b></span><input class="range" id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"></label>`}
function button(text,id){return `<button class="btn" id="${id}">${text}</button>`}function bind(id,fn,fmt=x=>x){let e=document.querySelector('#'+id),v=document.querySelector('#'+id+'v');e.oninput=()=>{fn(+e.value);v.textContent=fmt(+e.value)}}
function glow(x,y,r,color){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(.28,color+'aa');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
const scenes={
 sight:{init(){state={stage:0};title.innerHTML='How do we see anything?<span class="sub">Follow the light</span>';controls.innerHTML=button('Next idea','next')+button('Reset','reset');next.onclick=()=>state.stage=(state.stage+1)%3;reset.onclick=()=>state.stage=0},draw(t){starfield(120);let ox=W*.48,oy=H*.5,eyeX=W*.82;glow(W*.14,H*.3,110,'#ffd27a');ctx.fillStyle='#ffc96b';ctx.beginPath();ctx.arc(W*.14,H*.3,18,0,7);ctx.fill();ctx.fillStyle=state.stage===2?'#02030a':'#2e7ea0';ctx.beginPath();ctx.arc(ox,oy,62,0,7);ctx.fill();ctx.strokeStyle='#89e7ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(eyeX,oy,26,Math.PI*.2,Math.PI*1.8);ctx.stroke();let flow=(t*.00018)%1;for(let i=0;i<9;i++){let p=(flow+i/9)%1,x,y;if(state.stage===0){x=lerp(W*.14,eyeX,p);y=lerp(H*.3,oy,p)}else if(state.stage===1){if(p<.5){x=lerp(W*.14,ox,p*2);y=lerp(H*.3,oy,p*2)}else{x=lerp(ox,eyeX,(p-.5)*2);y=oy}}else{x=lerp(W*.14,ox,p);y=lerp(H*.3,oy,p)}ctx.fillStyle='#fff4bd';ctx.beginPath();ctx.arc(x,y,3.2,0,7);ctx.fill()}readout.innerHTML=state.stage===0?'A source <span>emits</span> light':state.stage===1?'An object <span>reflects</span> light':'What if light <span>cannot leave?</span>'}},
 escape:{init(){state={m:1,r:696340};let lr=Math.log10(state.r),rf=x=>Math.round(Math.pow(10,x)).toLocaleString()+' km';title.innerHTML='Michell’s dark star<span class="sub">Newtonian escape velocity</span>';controls.innerHTML=group('Mass (solar)',.1,100,0.1,1,'m',x=>x.toFixed(1)+' M☉')+group('Radius',.5,Math.log10(696340),.001,lr,'r',rf)+button('Reset','reset');bind('m',x=>state.m=x,x=>x.toFixed(1)+' M☉');bind('r',x=>state.r=Math.pow(10,x),rf);reset.onclick=()=>sceneInit()},draw(){starfield();let G=6.6743e-11,Ms=1.98847e30,c=299792458,vesc=Math.sqrt(2*G*state.m*Ms/(state.r*1000)),f=vesc/c;let x=W*.5,y=H*.48,R=clamp(55+Math.log10(696340/state.r)*25,55,180);glow(x,y,R*2,f>.7?'#ef6b52':'#ffc96b');ctx.fillStyle=f>=1?'#000':'#f8b84f';ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();ctx.strokeStyle=f>=1?'#d98b6a':'#ffe4a6';ctx.stroke();readout.innerHTML=`Escape velocity <span>${(vesc/1000).toLocaleString(undefined,{maximumFractionDigits:0})} km/s</span> · ${(f*100).toFixed(2)}% of light speed`}},
 redshift:{init(){state={z:0};title.innerHTML='3C 273<span class="sub">Align the hydrogen fingerprints</span>';controls.innerHTML=group('Redshift z',0,.3,.001,0,'z',x=>x.toFixed(3))+button('Match 3C 273','match')+button('Reset','reset');bind('z',x=>state.z=x,x=>x.toFixed(3));match.onclick=()=>{state.z=.158;z.value=.158;zv.textContent='.158'};reset.onclick=()=>sceneInit()},draw(){starfield(180);let lines=[410.17,434.05,486.13,656.28],min=380,max=780,L=W*.72,x0=W*.14,y1=H*.39,y2=H*.61;function wlX(w){return x0+(w-min)/(max-min)*L}ctx.font='14px system-ui';ctx.fillStyle='#b8c8d8';ctx.fillText('LABORATORY HYDROGEN',x0,y1-46);ctx.fillText('3C 273 — OBSERVED',x0,y2-46);for(let y of [y1,y2]){let g=ctx.createLinearGradient(x0,0,x0+L,0);g.addColorStop(0,'#6140a0');g.addColorStop(.25,'#358ce3');g.addColorStop(.45,'#42ce8b');g.addColorStop(.67,'#f2df55');g.addColorStop(1,'#da4545');ctx.globalAlpha=.38;ctx.fillStyle=g;ctx.fillRect(x0,y-18,L,36);ctx.globalAlpha=1}for(let w of lines){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(wlX(w*(1+state.z)),y1-27);ctx.lineTo(wlX(w*(1+state.z)),y1+27);ctx.stroke();ctx.strokeStyle='#72e8ff';ctx.beginPath();ctx.moveTo(wlX(w*1.158),y2-27);ctx.lineTo(wlX(w*1.158),y2+27);ctx.stroke()}let err=Math.abs(state.z-.158);readout.innerHTML=err<.004?'Ordinary hydrogen, shifted by <span>z = 0.158</span>':'Slide the white lines until the spectra match'}},
 orbit:{init(){state={M:4e6,a:1,e:.72,theta:0,trail:[]};title.innerHTML='Weighing the invisible<span class="sub">Velocity Verlet orbit integration</span>';controls.innerHTML=group('Central mass',.3,10,.1,4,'m',x=>x.toFixed(1)+' million M☉')+group('Orbit shape',0,.9,.01,.72,'e',x=>x.toFixed(2))+button('Reset','reset');bind('m',x=>state.M=x*1e6,x=>x.toFixed(1)+' million M☉');bind('e',x=>{state.e=x;resetOrbit()},x=>x.toFixed(2));reset.onclick=()=>resetOrbit();resetOrbit()},draw(t,dt){starfield(220);let cx=W*.5,cy=H*.47,scale=Math.min(W,H)*.24;if(!paused){let mu=state.M/4e6,steps=4,h=dt*.00018;for(let s=0;s<steps;s++){let r=Math.hypot(state.x,state.y),ax=-mu*state.x/r**3,ay=-mu*state.y/r**3;state.x+=state.vx*h+.5*ax*h*h;state.y+=state.vy*h+.5*ay*h*h;let r2=Math.hypot(state.x,state.y),ax2=-mu*state.x/r2**3,ay2=-mu*state.y/r2**3;state.vx+=(ax+ax2)*.5*h;state.vy+=(ay+ay2)*.5*h}state.trail.push([state.x,state.y]);if(state.trail.length>900)state.trail.shift()}ctx.strokeStyle='#57d9ff88';ctx.lineWidth=2;ctx.beginPath();state.trail.forEach((p,i)=>i?ctx.lineTo(cx+p[0]*scale,cy+p[1]*scale):ctx.moveTo(cx+p[0]*scale,cy+p[1]*scale));ctx.stroke();glow(cx,cy,32,'#7fdfff');ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,8,0,7);ctx.fill();glow(cx+state.x*scale,cy+state.y*scale,18,'#fff1b3');ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+state.x*scale,cy+state.y*scale,5,0,7);ctx.fill();readout.innerHTML=`Hidden mass <span>${(state.M/1e6).toFixed(1)} million Suns</span>`}},
 s02:{init(){state={phase:0,speed:1};title.innerHTML='S0-2 around Sagittarius A*<span class="sub">16-year orbit · fitted Kepler ellipse</span>';controls.innerHTML=group('Playback',.2,5,.1,1,'speed',x=>x.toFixed(1)+'×')+button('Reset','reset');bind('speed',x=>state.speed=x,x=>x.toFixed(1)+'×');reset.onclick=()=>state.phase=0},draw(t,dt){starfield(300);if(!paused)state.phase=(state.phase+dt*.000045*state.speed)%(Math.PI*2);let e=.884,a=Math.min(W,H)*.31,cx=W*.5,cy=H*.48;function solve(M){let E=M;for(let i=0;i<7;i++)E-= (E-e*Math.sin(E)-M)/(1-e*Math.cos(E));return E}let E=solve(state.phase),x=a*(Math.cos(E)-e),y=a*Math.sqrt(1-e*e)*Math.sin(E);ctx.save();ctx.translate(cx,cy);ctx.rotate(-.2);ctx.strokeStyle='#5bdfff55';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-a*e,0,a,a*Math.sqrt(1-e*e),0,0,7);ctx.stroke();glow(0,0,35,'#5bdfff');ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill();glow(x,y,20,'#fff0ae');ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.restore();readout.innerHTML='4,000,000 Suns. <span>Almost nothing to see.</span>'}},
 scale:{init(){state={logAU:0,mass:66e9,reveal:false};title.innerHTML='How big can a black hole get?<span class="sub">Geometric event-horizon comparison</span>';controls.innerHTML=group('View radius (AU)',0,3.2,.01,0,'zoom',x=>Math.pow(10,x).toFixed(x<1?1:0)+' AU')+group('Black-hole mass',6,11,.01,Math.log10(66e9),'mass',x=>(Math.pow(10,x)/1e9).toFixed(1)+' billion M☉')+button('Reveal · B','reveal')+button('Reset','reset');bind('zoom',x=>state.logAU=x,x=>Math.pow(10,x).toFixed(x<1?1:0)+' AU');bind('mass',x=>state.mass=Math.pow(10,x),x=>(Math.pow(10,x)/1e9).toFixed(1)+' billion M☉');reveal.onclick=()=>state.reveal=!state.reveal;reset.onclick=()=>sceneInit()},draw(){starfield(340);let cx=W*.5,cy=H*.48,maxAU=Math.pow(10,state.logAU),s=Math.min(W,H)*.36/maxAU;let planets=[['Earth',1,'#4fc3ff'],['Jupiter',5.2,'#e2b681'],['Neptune',30.1,'#4f79ff'],['Pluto',39.5,'#c8c0b2'],['100 AU',100,'#8295a8'],['500 AU',500,'#8295a8'],['1,000 AU',1000,'#8295a8']];ctx.lineWidth=1;for(let [n,r,col] of planets){if(r>maxAU*1.25)continue;ctx.strokeStyle=col+'66';ctx.beginPath();ctx.arc(cx,cy,r*s,0,7);ctx.stroke();ctx.fillStyle=col;ctx.font='12px system-ui';ctx.fillText(n,cx+r*s+7,cy)}glow(cx,cy,18,'#ffd27a');ctx.fillStyle='#ffc766';ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fill();let rsAU=2*6.6743e-11*state.mass*1.98847e30/(299792458**2)/1.495978707e11;if(state.reveal){ctx.fillStyle='#000';ctx.strokeStyle='#d88c6d99';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,rsAU*s,0,7);ctx.fill();ctx.stroke()}readout.innerHTML=state.reveal?`Event-horizon radius <span>${rsAU.toFixed(0)} AU</span> · ${(state.mass/1e9).toFixed(1)} billion Suns`:'Ask the audience to shout <span>STOP</span> · press B to reveal'}},
};
function resetOrbit(){let e=state.e||.72,r=1-e;state.x=r;state.y=0;state.vx=0;state.vy=Math.sqrt((1+e)/(1-e));state.trail=[]}
let sceneName=(new URLSearchParams(location.search).get('scene')||location.hash.slice(1)||'scale').toLowerCase();if(!scenes[sceneName])sceneName='scale';let scene=scenes[sceneName];function sceneInit(){paused=false;scene.init()}sceneInit();
function frame(t){let dt=Math.min(33,t-last);last=t;scene.draw(t,dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();paused=!paused}else if(e.key.toLowerCase()==='r')sceneInit();else if(e.key.toLowerCase()==='h')controls.classList.toggle('hidden');else if(e.key.toLowerCase()==='b'&&sceneName==='scale')state.reveal=!state.reveal});
</script>
</body>
</html>
